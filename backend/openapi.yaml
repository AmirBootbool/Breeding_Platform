      type: object
      properties:
        id:
          type: integer
          readOnly: true
        cross_code:
          type: string
          maxLength: 100
        female_parent:
          type: integer
        female_parent_name:
          type: string
          readOnly: true
        male_parent:
          type: integer
        male_parent_name:
          type: string
          readOnly: true
        cross_date:
          type: string
          format: date
        location:
          type: integer
          nullable: true
        location_name:
          type: string
          readOnly: true
        notes:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
