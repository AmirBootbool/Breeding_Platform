          readOnly: true
        pedigree:
          type: string
          readOnly: true
        species:
          type: string
          readOnly: true
        genus:
          type: string
          readOnly: true
        commonCropName:
          type: string
          readOnly: true
        breedingMethod:
          type: string
          readOnly: true
        yearOfDevelopment:
          type: integer
          readOnly: true
        programDbId:
          type: string
          readOnly: true
        programName:
          type: string
          readOnly: true
        additionalInfo:
          type: string
          readOnly: true
      required:
      - accessionNumber
      - additionalInfo
      - breedingMethod
      - commonCropName
      - defaultDisplayName
      - genus
      - germplasmDbId
      - germplasmName
      - pedigree
      - programDbId
      - programName
      - species
      - yearOfDevelopment
