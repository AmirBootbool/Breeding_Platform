          format: double
          readOnly: true
        longitude:
          type: number
          format: double
          readOnly: true
        countryName:
          type: string
          readOnly: true
        countryCode:
          type: string
          readOnly: true
        additionalInfo:
          type: string
          readOnly: true
      required:
      - additionalInfo
      - countryCode
      - countryName
      - latitude
      - locationDbId
      - locationName
      - longitude
    BrapiObservation:
      type: object
