      - created_at
      - cross_code
      - cross_date
      - female_parent
      - female_parent_name
      - id
      - location_name
      - male_parent
      - male_parent_name
      - updated_at
    CrossTypeEnum:
      enum:
      - biparental
      - self
      - backcross
      - doubled_haploid
      - other
      - unknown
      type: string
      description: |-
        * `biparental` - Biparental cross
        * `self` - Self-pollinated
        * `backcross` - Backcross
        * `doubled_haploid` - Doubled haploid
        * `other` - Other
        * `unknown` - Unknown
    DataTypeEnum:
      enum:
      - numeric
      - integer
      - categorical
      - text
      - date
      type: string
      description: |-
        * `numeric` - Numeric
        * `integer` - Integer
        * `categorical` - Categorical
        * `text` - Text
        * `date` - Date
    DesignTypeEnum:
      enum:
      - RCBD
      - alpha_lattice
      - augmented
      - unreplicated
      - other
      type: string
      description: |-
        * `RCBD` - RCBD
        * `alpha_lattice` - Alpha-lattice
        * `augmented` - Augmented
        * `unreplicated` - Unreplicated
        * `other` - Other
    Germplasm:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 300
        germplasm_db_id:
          type: string
          maxLength: 100
        species:
          type: string
          maxLength: 100
        program:
          type: integer
        program_name:
          type: string
          readOnly: true
        parent_female:
          type: integer
          nullable: true
          description: Female (seed) parent
        parent_female_name:
          type: string
          readOnly: true
        parent_male:
          type: integer
          nullable: true
          description: Male (pollen) parent
        parent_male_name:
          type: string
          readOnly: true
        pedigree_string:
          type: string
          description: Free-text pedigree notation, e.g. "KAUZ/PASTOR".
          maxLength: 500
        cross_type:
          $ref: '#/components/schemas/CrossTypeEnum'
        year_developed:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
        notes:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        created_by_username:
          type: string
          readOnly: true
        updated_by_username:
          type: string
          readOnly: true
