  /api/diagnostic-markers/:
    get:
      operationId: api_diagnostic_markers_list
      parameters:
      - in: query
        name: assay_type
        schema:
          type: string
          enum:
          - KASP
          - PCR_Gel
          - SNP_Chip
          - TaqMan
        description: |-
          * `KASP` - KASP Assay
          * `TaqMan` - TaqMan Probe
          * `PCR_Gel` - Gel / STS / CAPS PCR
          * `SNP_Chip` - SNP Array Probe
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: program
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: trait_category
        schema:
          type: string
          enum:
          - abiotic
          - agronomic
          - disease
          - phenology
          - quality
        description: |-
          * `disease` - Disease Resistance
          * `agronomic` - Agronomic / Yield
          * `quality` - Grain Quality
          * `phenology` - Phenology / Adaptation
          * `abiotic` - Abiotic Stress
